<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeartGold building inspection</title><style>
*{box-sizing:border-box}body{margin:0;background:#17272d;color:#f2f2e7;font:14px system-ui,sans-serif}header{padding:12px 18px;background:#233b44;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0 0 9px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{background:#f4f0df;color:#17272d;border:0;border-radius:4px;padding:7px;font:inherit}button{cursor:pointer}#details{padding:10px 18px;min-height:68px;line-height:1.5}#canvas{display:block;width:100%;height:calc(100vh - 200px);min-height:520px}#labels{pointer-events:none;position:absolute;inset:0;display:grid;gap:2px}.label{padding:10px;text-shadow:0 1px 3px #000;background:linear-gradient(#142a2cbb,transparent 55px);position:relative}.label a{pointer-events:auto;color:#fff2a9}#stage{position:relative}#note{min-width:270px;flex:1}.bad{color:#ffbb93}.status{color:#d5e3ba}footer{padding:8px 18px;font-size:12px;color:#b5c7cc}a{color:#f8d88b}.selected{outline:2px solid #ffde7c}
</style></head><body><header><h1>Native building inspection · actual source GLBs</h1><nav><button id="previous">Previous</button><select id="family" aria-label="Building family"></select><select id="asset" aria-label="Building asset"></select><button id="next">Next</button><select id="placement" aria-label="Source placement"></select><select id="mode" aria-label="Render mode"><option value="repaired">Old generic repairs</option><option value="source">Source geometry</option><option value="candidate">Candidate closed shells</option></select><button id="layout">Rear contact sheet</button></nav></header><div id="details">Loading native inspection inventory…</div><div id="stage"><canvas id="canvas"></canvas><div id="labels"></div></div><footer><nav><select id="status" aria-label="Manual visual verdict"><option value="pending">Pending visual review</option><option value="pass">Visually checked: pass</option><option value="issue">Visually checked: issue</option></select><input id="note" aria-label="Inspection note" placeholder="Describe the visible issue or evidence"><button id="save-note">Save inspection note</button><button id="download">Export review notes</button></nav><p>Six views are from the selected native placement. A raycast pass and a visual pass are separate. Notes use a separate inspection storage key and do not touch game saves.</p></footer><script type="module" src="/src/source/building-gallery.ts"></script></body></html>
