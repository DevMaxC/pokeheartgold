<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#273c50"><title>Pokémon HeartGold — 3D</title></head><body><main id="game"><canvas id="original-world" tabindex="0" aria-label="HeartGold 3D world. WASD to move, F to interact, Q and E to rotate camera."></canvas><header id="game-hud"><div><span class="game-brand">POKÉMON <b>HEARTGOLD</b></span><h1 id="map-name">Johto</h1><p id="map-detail"></p></div><div class="hud-actions"><button id="phone-ring" aria-label="Answer Professor Elm’s call" aria-live="polite" hidden>Professor Elm is calling<small>Answer <kbd>R</kbd></small></button><button id="open-menu">Menu <kbd>Esc</kbd></button></div></header><div id="party-hud"></div><footer id="control-hud"><span><kbd>W A S D</kbd> Move</span><span><kbd>F</kbd> Talk / confirm</span><span><kbd>Q E</kbd> Camera</span><span><kbd>Shift</kbd> Run</span></footer><div id="dialogue" role="dialog" aria-label="Dialogue" hidden><div id="dialogue-speaker"></div><p id="dialogue-text"></p><button id="dialogue-next">Next <span>▼</span></button></div><section id="panel" class="game-overlay" role="dialog" aria-modal="true" aria-label="Game menu" hidden><div class="game-panel"><div id="panel-content"></div></div></section><section id="battle-screen" hidden></section><div id="loading" role="status">Loading Johto…</div><div id="touch-pad"><button data-control="KeyW" aria-label="Move north">↑</button><button data-control="KeyA" aria-label="Move west">←</button><button data-control="KeyS" aria-label="Move south">↓</button><button data-control="KeyD" aria-label="Move east">→</button><button data-control="KeyF" aria-label="Interact">A</button></div></main><script type="module" src="/src/source/main.ts"></script></body></html>
