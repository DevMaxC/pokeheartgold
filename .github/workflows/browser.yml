name: Browser prototype
on:
  push:
    paths: ['browser/**', '.github/workflows/browser.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/browser.yml']
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
